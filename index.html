.mq{--bg:#fff;--hd:#4c1d95;--hc:#fff;--bar:#f3f0ff;--bm:#e9e5f5;--me:#d9fdd3;--th:#fff;--tx:#111;--ac:#6A3FE8;--sys:#fff8c4;--bd:#ddd;position:fixed;inset:0;z-index:10000;display:none;background:rgba(0,0,0,.6);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.mq input,.mq select,.mq textarea{font:16px system-ui;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:7px 9px;outline:0;min-width:0}
.mq input[type=checkbox]{width:auto}
.mq .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--hd);color:var(--hc)}

.mq .bar select,.mq .bar .pn{flex:1}.mq .bar label{white-space:nowrap}
.mq .chat{display:flex;flex-direction:column;flex:1;min-height:0}

.mq .nm{font-size:12px;font-weight:700;color:var(--ac)}.mq .me .nm{display:none}
.mq .st{color:#f59e0b;letter-spacing:2px;font-size:14px}.mq .t{white-space:pre-wrap}

.mq .st:empty,.mq .n:empty{display:none}

(()=>{
const C=window.MQ_CFG,$=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const get=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};

let uid=get('mq_user_id','');if(!uid){uid='uid_'+Math.random().toString(36).slice(2,11);put('mq_user_id',uid)}
const LANGS='en ur sd hi pa bn ar fa ps tr ru uk id ms tl th vi zh-CN ja ko es fr de pt it nl pl sw ta te mr gu ne he'.split(' ');
const CCS='PK IN BD AF IR AE SA TR EG RU UA KZ UZ ID MY PH TH VN CN JP KR NG KE ZA US GB CA AU DE FR ES IT BR MX NL PL'.split(' ');
const nv=(navigator.language||'en').split('-'),rg=(nv[1]||'').toUpperCase();
let ad=false;try{ad=sessionStorage.getItem('mq_isAdmin')==='1'}catch(e){}
const S={uid,admin:false,lang:get('mq_lang',LANGS.includes(nv[0])?nv[0]:'en'),auto:get('mq_auto','1')==='1',name:get('mq_name',''),cc:get('mq_cc',CCS.includes(rg)?rg:'PK'),theme:get('mq_theme','light')};
const flag=c=>/^[A-Z]{2}$/.test(c)&&c!=='XX'?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt())):'🌍';
const lname=(c,l)=>{if(c==='tl')return'Filipino';try{return new Intl.DisplayNames([l||c],{type:'language'}).of(c)}catch(e){return c}};

/* ---------- Firebase ---------- */
let DB=null,AU=null;
try{const f=C.firebase;if(typeof firebase!=='undefined'&&f.apiKey&&!/PASTE/.test(f.apiKey+f.databaseURL)){firebase.initializeApp(f);DB=firebase.database();AU=firebase.auth()}}catch(e){console.warn('Firebase init failed',e)}
const TS=()=>DB?firebase.database.ServerValue.TIMESTAMP:Date.now();

/* ---------- Translation: any language -> reader's language, auto-detect source ---------- */
const TC={},Q=[];let busy=0;
const pump=()=>{while(busy<3&&Q.length){busy++;Q.shift()().finally(()=>{busy--;pump()})}};
const run=f=>new Promise(res=>{Q.push(()=>f().then(res,()=>res(null)));pump()});
const jf=async u=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{return await(await fetch(u,{signal:c.signal})).json()}finally{clearTimeout(t)}};
async function tr(text,to,hint){
 const k=to+'|'+text;if(TC[k])return TC[k];
 const e=encodeURIComponent(text);let r=null;
 try{const j=await jf(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${to}&dt=t&q=${e}`);r={t:j[0].map(x=>x[0]).join(''),from:j[2]}}catch(x){}
 if(!r)try{const j=await jf(`https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=auto&tl=${to}&q=${e}`);r={t:j.sentences.map(x=>x.trans).join(''),from:j.src}}catch(x){}
 if(!r&&hint&&hint!==to)try{const j=await jf(`https://api.mymemory.translated.net/get?q=${e}&langpair=${hint}|${to}`);if(j.responseStatus==200&&j.responseData.translatedText)r={t:j.responseData.translatedText,from:hint}}catch(x){}
 return r&&r.t?(TC[k]=r):null}
async function render(b){
 const d=b._d,t=b.querySelector('.t'),n=b.querySelector('.n'),k=b._k=(b._k||0)+1,want=!b._me&&!d.st&&(b._ov===undefined?S.auto:b._ov);
 t.textContent=d.text;
 if(!want){n.textContent=b._me?'':(S.auto?'↩ Show translation':'🌐 Translate');return}
 n.textContent='🌐 Translating…';
 const r=await run(()=>tr(d.text,S.lang,d.lang));
 if(k!==b._k)return;
 if(!r){b._f=1;n.textContent='⚠ Tap to retry translation';return}
 b._f=0;
 if((r.from&&r.from.split('-')[0]===S.lang.split('-')[0])||r.t.trim()===d.text.trim()){n.textContent='';return}
 t.textContent=r.t;n.textContent='🌐 '+(r.from?lname(r.from,'en'):'Auto')+' → '+lname(S.lang,'en')+' · Show original'}
const renderAll=()=>$$('.mq .b[data-m]').forEach(b=>{b._ov=undefined;render(b)});

/* ---------- UI building ---------- */
const LO=LANGS.map(c=>{const a=lname(c),b=lname(c,'en');return`<option value="${c}">${a===b?a:a+' · '+b}</option>`}).join('');
const CO=CCS.map(c=>`<option value="${c}">${flag(c)} ${rname(c)}</option>`).join('')+'<option value="XX">🌍 Other</option>';
const hd=(id,t,s,x='')=>`<div class="hd"><button class="x" aria-label="Back">←</button><div class="ttl"><b>${t}</b><small id="${id}-sub">${s}</small></div>${x}<button class="th" title="Theme">🎨</button></div><div class="bar"><span>🌐 I read in</span><select class="lg">${LO}</select><label><input type="checkbox" class="au"> Auto</label></div>`;
const pf='<div class="bar"><input class="pn" maxlength="20" placeholder="Your name"><select class="pc">'+CO+'</select></div>';
document.body.insertAdjacentHTML('beforeend',
`<div class="mq" id="mq-ch"><div class="mq-box">${hd('ch','Live Room Chat','Connecting…','<button class="adm" title="Admin">🛡️</button>')}${pf}
<div class="chat"><div class="msgs" id="ch-m"></div><div class="cmp"><input id="ch-i" placeholder="Message..." maxlength="500" enterkeyhint="send" autocomplete="off"><button id="ch-s" aria-label="Send">➤</button></div></div></div></div>
<div class="mq" id="mq-fb"><div class="mq-box">${hd('fb','Feedback Wall','No reviews yet')}${pf}
<div class="chat"><div class="msgs" id="fb-m"></div><div class="cmp col"><div class="stars" id="fb-st"></div><div class="row"><textarea id="fb-i" rows="2" placeholder="Feedback..." maxlength="500"></textarea><button id="fb-s" aria-label="Send">➤</button></div></div></div></div></div>

<div class="row"><button class="pri" id="pv-j">Join room</button><button id="pv-g">🎲 New room</button></div><div class="row"><button id="pv-pa">📋 Paste invite link</button></div></div>
<div class="chat" id="pv-chat" hidden><div class="tools"><button id="pv-c">🔗 Copy invite</button><button id="pv-sh">📤 Share</button><button id="pv-l">🚪 Leave</button></div><div class="msgs" id="pv-m"></div><div class="cmp"><input id="pv-i" placeholder="Message..." maxlength="500" enterkeyhint="send" autocomplete="off"><button id="pv-s" aria-label="Send">➤</button></div></div></div></div>`);
$('#fb-st').innerHTML=[1,2,3,4,5].map(n=>`<span data-n="${n}">★</span>`).join('');
let R=5;const stars=()=>$$('#fb-st span').forEach(s=>s.classList.toggle('on',+s.dataset.n<=R));stars();
const syncUI=skip=>{$$('.lg').forEach(e=>e.value=S.lang);$$('.au').forEach(e=>e.checked=S.auto);$$('.pc').forEach(e=>e.value=S.cc);$$('.pn').forEach(e=>{if(e!==skip)e.value=S.name})};
const paint=()=>$$('.mq').forEach(m=>{m.dataset.t=S.theme;m.classList.toggle('adm',S.admin)});
syncUI();paint();

/* ---------- Bubbles ---------- */
function bubble(d,me,del){
 d.text=String(d.text||'');
 const b=document.createElement('div');b.className='b'+(me?' me':'');b._d=d;b._me=me;b.dataset.m=1;
 b.innerHTML='<div class="nm"></div><div class="st"></div><div class="q" hidden></div><div class="t"></div><div class="n"></div><div class="rcs"></div><div class="mt"><span class="tm"></span><span class="tk"></span><span class="cp" title="Copy">'+SVGC+'</span><span class="xd">🗑</span></div>';
 const q=s=>b.querySelector(s);
 {const a=document.createElement('span');a.className='av2';if(okAv(d.av)){const im=new Image();im.src=d.av;im.referrerPolicy='no-referrer';a.appendChild(im)}else{a.textContent=(d.name||'G')[0].toUpperCase();a.style.background=hue(d.name)}picFor(d.uid,a);q('.nm').append(a,(d.cc?flag(d.cc)+' ':'')+(d.name||'Guest'))}
 const r=Math.max(0,Math.min(5,+d.r||0));if(r)q('.st').textContent='★'.repeat(r)+'☆'.repeat(5-r);
 if(d.rp){const k=q('.q');k.hidden=false;k.dataset.j=d.rp.id;k.innerHTML='<b></b><span></span>';k.firstChild.textContent=d.rp.n||'';k.lastChild.textContent=d.rp.t||''}
 if(d.st)q('.t').classList.add('stk');
 q('.tm').textContent=tm(d.ts);
 const x=q('.xd');if(del)x.onclick=()=>confirm('Delete this message?')&&(del(),DB||b.remove());else x.remove();
 q('.n').onclick=()=>{if(b._f){render(b);return}b._ov=!(b._ov===undefined?S.auto:b._ov);render(b)};
 reacts(b);render(b);return b}
const sys=(L,t)=>{const d=document.createElement('div');d.className='b sys';d.textContent=t;L.appendChild(d);return d};
const stick=(L,f,force)=>{const n=L.scrollHeight-L.scrollTop-L.clientHeight<150;f();if(n||force)L.scrollTop=L.scrollHeight};
const rm=(sel,id)=>{const e=$(sel).querySelector(`[data-id="${id}"]`);if(e)e.remove()};
let last=0;const ok=()=>{if(S.banned){alert('You are muted by the owner.');return false}if(C.requireLogin&&!S.user){alert('Please sign in with Google first (top of the chat).');return false}return Date.now()-last>700&&(last=Date.now())};
const T0=Date.now();

/* ---------- Public chat ---------- */
function chatAdd(id,d){
 const L=$('#ch-m');if(!d||!d.text||L.querySelector(`[data-id="${id}"]`))return;
 const me=d.uid===S.uid,b=bubble(d,me,()=>DB&&DB.ref('quizhub_chat/'+id).remove());b.dataset.id=id;
 b._p='quizhub_chat/'+id;stick(L,()=>L.appendChild(b),me);
 if(!me&&d.ts>T0&&!$('#mq-ch').classList.contains('on')){const i=$('#mq-b-chat i');i.textContent=(+i.textContent||0)+1;i.style.display='block'}}
function sendChat(st){const i=$('#ch-i'),t=st||i.value.trim();if(!t||!ok())return;if(!st)i.value='';
 const d={name:S.name||'Guest',cc:S.cc,text:t,lang:S.lang,uid:S.uid,av:S.av||null,ts:TS()};if(st)d.st=1;if(RP&&RPp==='ch'){d.rp=RP;clrRP()}
 if(DB)DB.ref('quizhub_chat').push(d);else chatAdd('l'+Date.now(),d)}
$('#ch-s').onclick=()=>sendChat();
$('#ch-i').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendChat()}};

/* ---------- Feedback ---------- */
const FB={};
function fbStats(){const v=Object.values(FB).filter(Boolean);$('#fb-sub').textContent=v.length?'⭐ '+(v.reduce((a,b)=>a+b)/v.length).toFixed(1)+' average · '+v.length+' reviews':'No reviews yet'}
function fbAdd(id,d){
 const L=$('#fb-m');if(!d||!d.text||L.querySelector(`[data-id="${id}"]`))return;
 const b=bubble(d,d.uid===S.uid,()=>DB&&DB.ref('quizhub_feedbacks/'+id).remove());b.dataset.id=id;
 b._p='quizhub_feedbacks/'+id;L.insertBefore(b,L.firstChild);FB[id]=+d.r||0;fbStats()}
$('#fb-s').onclick=()=>{const i=$('#fb-i'),t=i.value.trim();if(!t||!ok())return;i.value='';
 const d={name:S.name||'Guest',cc:S.cc,text:t,lang:S.lang,r:R,uid:S.uid,av:S.av||null,ts:TS()};
 if(DB)DB.ref('quizhub_feedbacks').push(d);else fbAdd('l'+Date.now(),d)};

/* ---------- Private chat (AES-GCM end-to-end) ---------- */
const P={room:'',key:null,ref:null,ok:0,bad:0};
async function mkKey(pw,room){const e=new TextEncoder(),m=await crypto.subtle.importKey('raw',e.encode(pw),{name:'PBKDF2'},false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:e.encode(room),iterations:100000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(t){const iv=crypto.getRandomValues(new Uint8Array(12)),c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},P.key,new TextEncoder().encode(t)));return btoa(String.fromCharCode(...iv,...c))}
async function dec(s){try{const r=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:r.slice(0,12)},P.key,r.slice(12)))}catch(e){return null}}
const inv=()=>location.href.split(/[?#]/)[0]+'?priv='+encodeURIComponent(P.room);
const copy=u=>navigator.clipboard?navigator.clipboard.writeText(u).then(()=>alert('Link copied'),()=>prompt('Copy this link:',u)):prompt('Copy this link:',u);
function privAdd(id,d){
 const L=$('#pv-m');if(L.querySelector(`[data-id="${id}"]`))return;
 const me=d.uid===S.uid,b=bubble(d,me,me?()=>DB&&DB.ref('quizhub_private/'+P.room+'/msgs/'+id).remove():null);b.dataset.id=id;
 b._p='quizhub_private/'+P.room+'/msgs/'+id;const nx=[...L.children].find(c=>c._d&&c._d.ts>d.ts);stick(L,()=>L.insertBefore(b,nx||null),me)}
function leave(){if(P.ref)P.ref.off();P.ref=null;P.key=null;P.room='';$('#pv-chat').hidden=true;$('#pv-join').hidden=false;$('#pv-p').value='';$('#pv-sub').textContent='End-to-end encrypted'}
async function join(){
 const room=$('#pv-r').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,''),pw=$('#pv-p').value;
 if(!room||!pw)return alert('Enter a room code and a password');
 if(!(window.crypto&&crypto.subtle))return alert('Private chat needs a secure (https) page.');
 leave();S.name=$('#pv-n').value.trim()||S.name||'Guest';put('mq_name',S.name);syncUI();
 P.room=room;P.key=await mkKey(pw,room);P.ok=P.bad=0;
 $('#pv-join').hidden=true;$('#pv-chat').hidden=false;$('#pv-sub').textContent='🔒 Room '+room;$('#pv-m').innerHTML='';
 if(!DB){sys($('#pv-m'),'⚠️ Not connected to the server — messages stay on this device.');return}
 P.ref=DB.ref('quizhub_private/'+room+'/msgs').limitToLast(100);
 P.ref.on('child_added',async s=>{const d=s.val();if(!d||!d.enc||!P.key)return;const t=await dec(d.enc);
  if(t===null){if(!P.ok&&++P.bad===1)sys($('#pv-m'),"⚠️ Can't read messages — wrong password or room code?");return}
  if(!P.ok++){const w=$('#pv-m .sys');if(w)w.remove()}let rp;if(d.rpe){try{rp=JSON.parse(await dec(d.rpe))}catch(e){}}privAdd(s.key,{...d,text:t,rp})});
 P.ref.on('child_removed',s=>rm('#pv-m',s.key));P.ref.on('child_changed',s=>upd('#pv-m',s.key,s.val()))}
$('#pv-j').onclick=join;
$('#pv-g').onclick=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),v=>A[v%32]).join('');$('#pv-r').value=r(6);const p=$('#pv-p');p.type='text';p.value=r(6)};
$('#pv-pa').onclick=()=>{const p=prompt('Paste the invite link');if(!p)return;try{const r=new URL(p).searchParams.get('priv');if(r)$('#pv-r').value=r.toUpperCase();else alert('No room found in that link')}catch(e){alert('Invalid link')}};
$('#pv-c').onclick=()=>copy(inv());
$('#pv-sh').onclick=()=>navigator.share?navigator.share({title:'Private room',text:'Join my private room "'+P.room+'" (ask me for the password)',url:inv()}).catch(()=>{}):copy(inv());
$('#pv-l').onclick=leave;
async function sendPriv(st){const i=$('#pv-i'),t=st||i.value.trim();if(!t||!P.key||!ok())return;if(!st)i.value='';
 const e=await enc(t),d={name:S.name||'Guest',enc:e,lang:S.lang,uid:S.uid,av:S.av||null,ts:TS()};if(st)d.st=1;if(RP&&RPp==='pv'){d.rpe=await enc(JSON.stringify(RP));clrRP()}
 if(DB)DB.ref('quizhub_private/'+P.room+'/msgs').push(d);else privAdd('l'+Date.now(),{...d,text:t,ts:Date.now()})}
$('#pv-s').onclick=()=>sendPriv();
$('#pv-i').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendPriv()}};

/* ---------- V19: daily question, diamonds, streaks, weekly top ---------- */
const QS=(window.MQ_QUESTIONS&&window.MQ_QUESTIONS.length)?window.MQ_QUESTIONS:[{q:'Which organelle produces most of the cell’s ATP?',o:['Ribosome','Mitochondria','Golgi apparatus','Lysosome'],a:1,e:'Mitochondria make most of the cell’s ATP.'}];
const dkey=t=>new Date(t||Date.now()).toISOString().slice(0,10);
const wkey=t=>{const d=new Date(t||Date.now());d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));const y=d.getUTCFullYear();return y+'-W'+String(Math.ceil(((d-Date.UTC(y,0,1))/864e5+1)/7)).padStart(2,'0')};

let LBT='w';

 return DB.ref('quizhub_scores/'+S.uid).transaction(c=>{c=c||{d:0,s:0,b:0,wd:0};
  c.s=c.last===y?(c.s||0)+1:(c.last===today?c.s:1);

  c.d=(c.d||0)+g;c.wd+=g;c.b=Math.max(c.b||0,c.s);c.last=today;c.name=S.name;c.av=S.av||'';c.cc=S.cc;return c})}

/* ---------- V20: profile photo upload + 24-hour stories ---------- */
const PICS={},PW={};let FPm='',STR=[],SEENS={},SV={list:[],i:0,cref:null,vref:null};
try{SEENS=JSON.parse(localStorage.getItem('mq_sst')||'{}')}catch(e){}
const okPic=u=>/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(u||'')&&u.length<150000;
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':Math.floor(m/60)+' h ago'};
function setPic(el,u){el.textContent='';el.style.background='none';const im=new Image();im.src=u;el.appendChild(im)}
function picFor(uid,el){if(!DB||!uid)return;el.dataset.u=uid;
 if(PICS[uid]!==undefined){if(PICS[uid])setPic(el,PICS[uid]);return}
 (PW[uid]=PW[uid]||[]).push(el);if(PW[uid].length>1)return;
 DB.ref('quizhub_pics/'+uid).once('value').then(x=>{const v=x.val();PICS[uid]=okPic(v)&&v.length<40000?v:false;(PW[uid]||[]).forEach(e=>PICS[uid]&&setPic(e,PICS[uid]));delete PW[uid]},()=>{PICS[uid]=false;delete PW[uid]})}
function shrink(file,max,q,sq){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{let w=im.width,h=im.height,sx=0,sy=0,sw=w,sh=h;
  if(sq){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;w=h=max}else{const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k)}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};
 im.onerror=()=>rej(new Error('bad image'));im.src=u})}
document.body.insertAdjacentHTML('beforeend','<input type="file" id="fp" accept="image/*" hidden><div class="mq" id="mq-sv"><div class="mq-box" style="background:#000;color:#fff"><div class="pgs" id="sv-pg"></div><div class="hd" style="background:none"><button class="x">←</button><span class="av2" id="sv-av" style="margin:0;width:34px;height:34px"></span><div class="ttl"><b id="sv-n"></b><small id="sv-t"></small></div><button id="sv-d" hidden title="Delete story">🗑</button></div><div class="svi"><button class="nv l" id="sv-l">‹</button><img id="sv-i" alt=""><button class="nv r" id="sv-r">›</button></div><div class="svc" id="sv-c"></div><div class="svm" id="sv-cm"></div><div class="cmp"><input id="sv-in" placeholder="Comment..." maxlength="200" autocomplete="off"><button id="sv-s">➤</button></div></div></div>');
$('#acct').insertAdjacentHTML('afterend','<div class="stb" id="stb"></div>');
paint();
function strip(){const w=$('#stb');w.innerHTML='';const g={};STR.forEach(x=>(g[x.uid]=g[x.uid]||[]).push(x));
 Object.keys(g).sort((a,b)=>a===S.uid?-1:b===S.uid?1:g[b][g[b].length-1].ts-g[a][g[a].length-1].ts).forEach(u=>{
  const l=g[u],d=document.createElement('div');d.className='rg'+(l.every(x=>SEENS[x.id])?' sn':'');d.dataset.u=u;d.innerHTML='<span class="av2"></span><span class="n"></span>';
  avEl(d.firstChild,l[0].av,l[0].name,u);d.lastChild.textContent=u===S.uid?'My story':l[0].name;w.appendChild(d)})}
function delStory(id){DB.ref('quizhub_story_meta/'+id).remove();DB.ref('quizhub_story_img/'+id).remove();DB.ref('quizhub_story_cm/'+id).remove();DB.ref('quizhub_story_views/'+id).remove()}
function detachSV(){if(SV.cref)SV.cref.off();if(SV.vref)SV.vref.off();SV.cref=SV.vref=null}
function openSV(u){SV.list=STR.filter(x=>x.uid===u);if(!SV.list.length)return;const n=SV.list.findIndex(x=>!SEENS[x.id]);SV.i=n<0?0:n;$('#mq-sv').classList.add('on');sv()}
function sv(){detachSV();const x=SV.list[SV.i];if(!x){$('#mq-sv').classList.remove('on');return}
 $('#sv-n').textContent=x.name||'User';const a=$('#sv-av');a.textContent='';a.style.background='';avEl(a,x.av,x.name,x.uid);
 $('#sv-t').textContent=ago(x.ts);$('#sv-c').textContent=x.cap||'';$('#sv-cm').innerHTML='';
 $('#sv-pg').innerHTML=SV.list.map((_,k)=>'<i'+(k<=SV.i?' class="on"':'')+'></i>').join('');
 const im=$('#sv-i');im.removeAttribute('src');
 DB.ref('quizhub_story_img/'+x.id).once('value').then(r=>{if(SV.list[SV.i]===x&&okPic(r.val()))im.src=r.val()});
 SEENS[x.id]=1;try{localStorage.setItem('mq_sst',JSON.stringify(SEENS))}catch(e){}strip();
 $('#sv-d').hidden=!(x.uid===S.uid||S.owner);
 SV.cref=DB.ref('quizhub_story_cm/'+x.id).limitToLast(50);
 SV.cref.on('child_added',r=>{const c=r.val();if(!c)return;const d=document.createElement('div');d.innerHTML='<b></b><span></span>';d.firstChild.textContent=c.name||'Guest';d.lastChild.textContent=c.text||'';const L=$('#sv-cm');L.appendChild(d);L.scrollTop=L.scrollHeight});
 if(x.uid!==S.uid)DB.ref('quizhub_story_views/'+x.id+'/'+S.uid).set(true);
 else{SV.vref=DB.ref('quizhub_story_views/'+x.id);SV.vref.on('value',r=>{$('#sv-t').textContent=ago(x.ts)+' · 👁 '+r.numChildren()})}}
function sendCm(){const i=$('#sv-in'),t=i.value.trim(),x=SV.list[SV.i];if(!t||!x||!DB||!ok())return;i.value='';DB.ref('quizhub_story_cm/'+x.id).push({uid:S.uid,name:S.name||'Guest',text:t,ts:TS()})}
$('#sv-in').onkeydown=e=>{if(e.key==='Enter')sendCm()};
$('#fp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!DB||!S.user)return;
 if(S.banned)return alert('You are muted by the owner.');
 try{
  if(FPm==='pic'){const d=await shrink(f,160,.8,true);await DB.ref('quizhub_pics/'+S.uid).set(d);PICS[S.uid]=d;$$('.av2[data-u="'+S.uid+'"]').forEach(el=>setPic(el,d));alert('Profile photo updated ✅')}
  else{if(STR.filter(x=>x.uid===S.uid).length>=5)return alert('You can have up to 5 stories at a time.');
   const cap=(prompt('Add a caption (optional)')||'').slice(0,120),img=await shrink(f,720,.7,false);if(img.length>140000)throw new Error('big');
   const id=DB.ref('quizhub_story_meta').push().key;await DB.ref('quizhub_story_img/'+id).set(img);
   await DB.ref('quizhub_story_meta/'+id).set({uid:S.uid,name:S.name||'User',av:S.av||'',cap,ts:TS()});alert('Story posted for 24 hours ✅')}
 }catch(x){alert('Could not upload that picture. Try another one.')}};
document.addEventListener('click',e=>{const t=e.target;
 if(t.id==='pp'){FPm='pic';$('#fp').click()}
 else if(t.id==='sa'){if(!DB)return alert('Not connected to the server yet.');FPm='st';$('#fp').click()}
 else if(t.closest('#stb .rg'))openSV(t.closest('.rg').dataset.u);
 else if(t.id==='sv-r'){SV.i++;sv()}
 else if(t.id==='sv-l'){if(SV.i>0){SV.i--;sv()}}
 else if(t.id==='sv-d'){const x=SV.list[SV.i];if(x&&confirm('Delete this story?')){delStory(x.id);SV.list.splice(SV.i,1);if(SV.i>=SV.list.length)SV.i=Math.max(0,SV.list.length-1);sv()}}
 else if(t.id==='sv-s')sendCm();
 else if(t.closest('#mq-sv .x')||t.id==='mq-sv')detachSV()});
if(DB)DB.ref('quizhub_story_meta').on('value',x=>{const cut=Date.now()-864e5,a=[];
 x.forEach(c=>{const v=c.val();if(!v)return;if(v.ts&&v.ts<cut){delStory(c.key);return}a.push({id:c.key,...v})});
 a.sort((p,q)=>p.ts-q.ts);STR=a;strip()});

/* ---------- Go live ---------- */
if(DB){
 const live=(path,add,del)=>{const q=DB.ref(path).limitToLast(100);q.on('child_added',s=>add(s.key,s.val()));q.on('child_removed',s=>del(s.key));q.on('child_changed',s=>upd(path==='quizhub_chat'?'#ch-m':'#fb-m',s.key,s.val()))};
 live('quizhub_chat',chatAdd,id=>rm('#ch-m',id));
 live('quizhub_feedbacks',fbAdd,id=>{rm('#fb-m',id);delete FB[id];fbStats()});
 DB.ref('.info/connected').on('value',s=>{if(s.val()){const r=DB.ref('quizhub_presence/'+S.uid);r.onDisconnect().remove();r.set(true)}});
 DB.ref('quizhub_presence').on('value',s=>{$('#ch-sub').textContent='👥 '+s.numChildren()+' online · live'});
}else{
 const m='⚠️ Not connected to the server yet. Messages stay on this device only. Add your Firebase keys in config.js to make this live for everyone.';
 $('#ch-sub').textContent='Offline mode';sys($('#ch-m'),m);sys($('#fb-m'),m)}
const pq=new URLSearchParams(location.search).get('priv');
if(pq){$('#pv-r').value=pq.toUpperCase();open('pv')}
})();
</script>

</body>
